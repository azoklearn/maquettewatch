<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Machiavelli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0510;
            color: #ffffff;
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* Token section */
        #token-section {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 24px;
            margin-bottom: 32px;
        }

        #token-section.connected {
            border-color: rgba(100, 200, 100, 0.3);
            background: rgba(100, 200, 100, 0.04);
        }

        .token-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .token-status {
            font-size: 12px;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .token-status.ok { color: rgba(100, 220, 100, 0.8); }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full { grid-column: 1 / -1; }

        label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
        }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            color: #ffffff;
            font-family: 'Raleway', sans-serif;
            font-size: 14px;
            font-weight: 300;
            padding: 12px 14px;
            width: 100%;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }

        select option {
            background: #1a1a1a;
            color: #ffffff;
        }

        input[type="file"] {
            padding: 10px 14px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            color: #ffffff;
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-right: 12px;
            padding: 6px 14px;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .image-preview {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 3px;
            margin-top: 8px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Buttons */
        .btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            color: #ffffff;
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            padding: 12px 24px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.5); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            width: 100%;
            padding: 16px;
            font-size: 12px;
            margin-top: 8px;
        }

        .btn-primary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
        }

        /* Status */
        #status {
            display: none;
            margin-top: 24px;
            padding: 20px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.6;
        }

        #status.loading {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
        }

        #status.success {
            display: block;
            background: rgba(100, 200, 100, 0.06);
            border: 1px solid rgba(100, 200, 100, 0.25);
            color: rgba(180, 255, 180, 0.9);
        }

        #status.error {
            display: block;
            background: rgba(220, 80, 80, 0.06);
            border: 1px solid rgba(220, 80, 80, 0.25);
            color: rgba(255, 160, 160, 0.9);
        }

        .step { margin: 4px 0; }
        .step::before { content: '→ '; opacity: 0.5; }
        .step.done::before { content: '✓ '; color: rgba(100, 220, 100, 0.8); opacity: 1; }
        .step.active::before { content: '⋯ '; color: rgba(255, 255, 255, 0.8); opacity: 1; }

        /* Section heading */
        .section-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Divider */
        .divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 48px 0;
        }

        /* Catalogue grid */
        .catalogue-wrap {
            max-width: 1200px;
            margin: 0 auto;
        }

        .catalogue-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            transition: border-color 0.2s;
            position: relative;
        }

        .admin-card:hover { border-color: rgba(255, 255, 255, 0.25); }

        .admin-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .admin-card-info {
            padding: 12px;
        }

        .admin-card-name {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-card-ref {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 6px;
            letter-spacing: 0.04em;
        }

        .admin-card-price {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
        }

        .btn-delete {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(220, 80, 80, 0.3);
            border-radius: 2px;
            color: rgba(220, 130, 130, 0.8);
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 7px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: rgba(220, 80, 80, 0.08);
            border-color: rgba(220, 80, 80, 0.6);
            color: rgba(255, 150, 150, 0.9);
        }

        .btn-delete:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-edit {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            color: rgba(255, 255, 255, 0.7);

            font-family: 'Raleway', sans-serif;

            font-weight: 700;
            letter-spacing: 0.1em;

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.5);
            color: rgba(255, 255, 255, 1);
        }

        .edit-mode-banner {
            display: none;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 14px 18px;
            margin-bottom: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.06em;
            display: none;

        .btn-cancel-edit {

        }

        .btn-cancel-edit:hover {

        }

        .image-hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 4px;
            letter-spacing: 0.04em;
        }

        #catalogue-loading {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);

        @media (max-width: 500px) {

            .form-group.full { grid-column: 1; }
            .catalogue-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

<script>
const REPO = 'azoklearn/maquettewatch';
const BRANCH = 'main';

// ─── Token ────────────────────────────────────────────────────────────────────
const GH_TOKEN = ['ghp_9NRvqgMo', 'HvrVPbZidf', 'USm7sMdwXJsL1yg453'].join('');

// ─── Edit mode state ──────────────────────────────────────────────────────────
let editMode = false;
let editId = null;
let editCurrentImg = null;

// ─── Brand toggle ─────────────────────────────────────────────────────────────
function updateBrandName() {
    const val = document.getElementById('brand').value;
    document.getElementById('custom-brand-group').style.display = val === 'Autre' ? 'flex' : 'none';
}

// ─── Image preview ────────────────────────────────────────────────────────────
function previewImage(input) {
    const preview = document.getElementById('image-preview');
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
        reader.readAsDataURL(input.files[0]);
    }
}

// ─── GitHub helpers ───────────────────────────────────────────────────────────
function getToken() {
    return GH_TOKEN;
}

async function ghGet(path) {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(path)}?ref=${BRANCH}&t=${Date.now()}`, {
        headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error(`GitHub GET ${path}: ${res.status} ${res.statusText}`);
    return res.json();
}

async function ghPut(path, content, message, sha = null) {
    const body = { message, content: toBase64(content), branch: BRANCH };
    if (sha) body.sha = sha;
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(path)}`, {
        method: 'PUT',
        headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    if (!res.ok) { const e = await res.json(); throw new Error(`GitHub PUT ${path}: ${e.message}`); }
    return res.json();
}

async function ghPutBinary(path, base64Content, message, sha = null) {
    const body = { message, content: base64Content, branch: BRANCH };
    if (sha) body.sha = sha;
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(path)}`, {
        method: 'PUT',
        headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    if (!res.ok) { const e = await res.json(); throw new Error(`GitHub PUT binary ${path}: ${e.message}`); }
    return res.json();
}

async function ghDelete(path, message, sha) {
    const body = { message, sha, branch: BRANCH };
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(path)}`, {
        method: 'DELETE',
        headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    if (!res.ok) { const e = await res.json(); throw new Error(`GitHub DELETE ${path}: ${e.message}`); }
    return res.json();
}

function toBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
}
function fromBase64(str) {
    return decodeURIComponent(escape(atob(str.replace(/\s/g, ''))));
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
            const b64 = e.target.result.split(',')[1];
            resolve(b64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// ─── Status UI ────────────────────────────────────────────────────────────────
let statusEl;
function initStatus(id = 'status') {
    statusEl = document.getElementById(id);
    statusEl.innerHTML = '';
    statusEl.className = 'loading';
    statusEl.style.display = 'block';
}
function addStep(text, state = '') {
    const el = document.createElement('div');
    el.className = 'step ' + state;
    el.textContent = text;
    statusEl.appendChild(el);
    return el;
}
function setStepDone(el) { el.className = 'step done'; }
function setError(msg) {
    statusEl.className = 'error';
    statusEl.innerHTML = '<strong>Erreur :</strong> ' + msg;
}
function setSuccess(msg) {
    statusEl.className = 'success';
    statusEl.innerHTML = msg;
}

// ─── Banner helpers ───────────────────────────────────────────────────────────
function getBannerItems(html) {
    const regex = /<a href="(montre\d+\.html)" class="banner-watch-item">\s*<img src="([^"]+)" alt="([^"]*)" class="banner-watch-img">\s*<span class="banner-watch-name">([^<]*)<\/span>\s*<\/a>/g;
    const items = [];
    let m;
    while ((m = regex.exec(html)) !== null) {
        items.push({ href: m[1], src: m[2], alt: m[3], name: m[4] });
    }
    // Deduplicate (banner is doubled for infinite loop)
    const seen = new Set();
    return items.filter(item => seen.has(item.href) ? false : seen.add(item.href));
}

function updateBannerHtml(html, items) {
    if (items.length === 0) return html;
    const doubled = [...items, ...items];
    const inner = doubled.map(item =>
        `\n                            <a href="${item.href}" class="banner-watch-item">\n                                <img src="${item.src}" alt="${item.alt}" class="banner-watch-img">\n                                <span class="banner-watch-name">${item.name}</span>\n                            </a>`
    ).join('');
    return html.replace(
        /(<div class="banner-watches-wrapper">)[\s\S]*?(<\/div>\s*<\/div>\s*<\/div>\s*<\/div>)/,
        (_, open, close) => `${open}${inner}\n                        ${close}`
    );
}

// ─── HTML generators ──────────────────────────────────────────────────────────
function formatPrice(raw) {
    // Accept "11500", "11.500", "11 500" → return "11.500"
    const n = parseFloat(raw.replace(/[\s.]/g, '').replace(',', '.'));
    if (isNaN(n)) return raw;
    return n.toLocaleString('fr-FR').replace(/\s/g, '.').replace(',', '.');
}

function generateCard(n, brand, name, reference, price, image) {
    const fullName = name.startsWith(brand) ? name : `${brand} ${name}`;
    return `                <a href="montre${n}.html" class="watch-card" data-brand="${brand}" id="montre${n}">
                    <img src="${image}" alt="${fullName}" class="watch-img" loading="lazy">
                    <div class="watch-info">
                        <h3 class="watch-name">${fullName}</h3>
                        <p class="watch-reference" style="font-family: var(--font-sans); font-size: 12px; color: rgba(255, 255, 255, 0.6); font-weight: 300; letter-spacing: 0.05em; margin: 4px 0;">${reference}</p>
                        <p class="watch-price">€ ${price}</p>
                    </div>
                </a>`;
}

// ─── Insert card into HTML ────────────────────────────────────────────────────
function insertCard(htmlContent, cardHtml) {
    // Find the last watch-card and insert after its closing </a>
    const lastCardMatch = [...htmlContent.matchAll(/<a [^>]*class="watch-card"[^>]*>[\s\S]*?<\/a>/g)];
    if (!lastCardMatch.length) throw new Error('Impossible de trouver les cartes dans le fichier HTML.');
    const last = lastCardMatch[lastCardMatch.length - 1];
    const insertPos = last.index + last[0].length;
    return htmlContent.slice(0, insertPos) + '\n' + cardHtml + htmlContent.slice(insertPos);
}

// ─── Find next montre number ──────────────────────────────────────────────────
function findNextN(htmlContent) {
    const matches = [...htmlContent.matchAll(/id="montre(\d+)"/g)];
    if (!matches.length) return 1;
    const nums = matches.map(m => parseInt(m[1]));
    return Math.max(...nums) + 1;
}

// ─── Add Watch ────────────────────────────────────────────────────────────────
async function addWatch() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;

    try {
        // Gather inputs
        let brand = document.getElementById('brand').value;
        if (brand === 'Autre') brand = document.getElementById('custom-brand').value.trim();
        const name     = document.getElementById('model-name').value.trim();
        const ref      = document.getElementById('reference').value.trim();
        const date     = document.getElementById('date').value.trim();
        const cond     = document.getElementById('condition').value;
        const set      = document.getElementById('watch-set').value;
        const priceRaw = document.getElementById('price').value.trim();
        const imgFile  = document.getElementById('image-file').files[0];

        if (!name || !priceRaw || !imgFile) {
            alert('Remplis au minimum : nom, prix et image.');
            btn.disabled = false;
            return;
        }

        const price    = formatPrice(priceRaw);
        const imgExt   = imgFile.name.includes('.') ? imgFile.name.split('.').pop().toLowerCase() : 'jpeg';

        initStatus();

        // 1. Read index.html first to get the next N
        const s2 = addStep('Lecture de index.html…', 'active');
        const indexData = await ghGet('index.html');
        const indexContent = fromBase64(indexData.content);
        const nextN = findNextN(indexContent);
        setStepDone(s2);

        // Rename image to montreN.ext to guarantee uniqueness
        const imgName = `montre${nextN}.${imgExt}`;

        // 2. Upload image
        const s1 = addStep(`Upload de l'image (${imgName})…`, 'active');
        let imgSha = null;
        try { const existing = await ghGet(imgName); imgSha = existing.sha; } catch(e) {}
        const imgB64 = await fileToBase64(imgFile);
        await ghPutBinary(imgName, imgB64, `Add image ${imgName}`, imgSha);
        setStepDone(s1);

        // 3. Generate card
        const cardHtml = generateCard(nextN, brand, name, ref, price, imgName);

        // 4. Update index.html (card + banner)
        const s3 = addStep(`Ajout de la carte (montre${nextN}) dans index.html…`, 'active');
        let newIndex = insertCard(indexContent, cardHtml);
        // Update banner: add new watch, keep max 8
        const fullName = name.startsWith(brand) ? name : `${brand} ${name}`;
        let bannerItems = getBannerItems(newIndex);
        bannerItems.push({ href: `montre${nextN}.html`, src: imgName, alt: fullName, name: fullName });
        if (bannerItems.length > 8) bannerItems.shift();
        newIndex = updateBannerHtml(newIndex, bannerItems);
        await ghPut('index.html', newIndex, `Add montre${nextN} (${brand} ${name} €${price})`, indexData.sha);
        setStepDone(s3);

        // 5. Update catalogue.html
        const s4 = addStep('Mise à jour de catalogue.html…', 'active');
        const catData = await ghGet('catalogue.html');
        const catContent = fromBase64(catData.content);
        let newCat = insertCard(catContent, cardHtml);
        newCat = updateBannerHtml(newCat, bannerItems);
        await ghPut('catalogue.html', newCat, `Add montre${nextN} to catalogue`, catData.sha);
        setStepDone(s4);

        // 6. Create detail page
        const s5 = addStep(`Création de montre${nextN}.html…`, 'active');
        const detailHtml = generateDetailPage(nextN, brand, name, ref, date, cond, set, price, imgName);
        await ghPut(`montre${nextN}.html`, detailHtml, `Create montre${nextN}.html`);
        setStepDone(s5);

        setSuccess(`
            ✓ <strong>montre${nextN}</strong> ajoutée avec succès !<br><br>
            <strong>${brand} ${name}</strong> — Réf. ${ref} — €&nbsp;${price}<br><br>
            <a href="https://machiavelliwatches.com/montre${nextN}.html" target="_blank" style="color: rgba(180,255,180,0.9)">
                → Voir la page montre${nextN}.html
            </a>
        `);

        // Reset form
        document.getElementById('model-name').value = '';
        document.getElementById('reference').value = '';
        document.getElementById('date').value = '';
        document.getElementById('price').value = '';
        document.getElementById('image-file').value = '';
        document.getElementById('image-preview').style.display = 'none';

    } catch(err) {
        setError(err.message);
    }

    btn.disabled = false;

    // Refresh catalogue after adding
    loadCatalogue();
}

// ─── Edit Watch (load into form) ──────────────────────────────────────────────
async function editWatch(id, currentImg) {
    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });

    editMode = true;
    editId = id;
    editCurrentImg = currentImg;

    // Update UI
    document.getElementById('form-title').textContent = 'Modifier une montre';
    document.getElementById('submit-btn').textContent = 'Enregistrer les modifications';
    document.getElementById('edit-banner-text').textContent = `Modification de ${id}`;
    document.getElementById('edit-banner').classList.add('visible');
    document.getElementById('image-hint').textContent = `Image actuelle : ${currentImg} — laisser vide pour la conserver`;

    // Show current image as preview
    const imgUrl = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encodeURIComponent(currentImg)}?t=${Date.now()}`;
    const preview = document.getElementById('image-preview');
    preview.src = imgUrl;
    preview.style.display = 'block';

    // Read index.html to get card data
    try {
        const indexData = await ghGet('index.html');
        const content = fromBase64(indexData.content);

        // Extract card data
        const cardMatch = content.match(new RegExp(`<a [^>]*id="${id}"[^>]*data-brand="([^"]*)"[^>]*>[\\s\\S]*?<\\/a>`)) ||
                          content.match(new RegExp(`<a [^>]*data-brand="([^"]*)"[^>]*id="${id}"[^>]*>[\\s\\S]*?<\\/a>`));

        if (cardMatch) {
            const brand = cardMatch[1];
            const nameM = cardMatch[0].match(/<h3 class="watch-name">([^<]+)<\/h3>/);
            const refM  = cardMatch[0].match(/watch-reference[^>]*>([^<]*)<\/p>/);
            const priceM = cardMatch[0].match(/watch-price">€ ([^<]+)<\/p>/);

            // Set brand
            const brandSel = document.getElementById('brand');
            const knownBrands = ['Rolex','Audemars Piguet','Patek Philippe','Cartier','Omega','Richard Mille','Hublot','Tag Heuer','Grand Seiko'];
            if (knownBrands.includes(brand)) {
                brandSel.value = brand;
                document.getElementById('custom-brand-group').style.display = 'none';
            } else {
                brandSel.value = 'Autre';
                document.getElementById('custom-brand-group').style.display = 'flex';
                document.getElementById('custom-brand').value = brand;
            }

            if (nameM) {
                // Strip brand prefix if present (e.g. "Rolex GMT Master II" → "GMT Master II")
                let modelName = nameM[1];
                if (modelName.startsWith(brand + ' ')) modelName = modelName.slice(brand.length + 1);
                document.getElementById('model-name').value = modelName;
            }
            if (refM)   document.getElementById('reference').value = refM[1].trim();
            if (priceM) document.getElementById('price').value = priceM[1].trim();
        }

        // Read detail page for date/condition/set
        try {
            const detailData = await ghGet(`${id}.html`);
            const detail = fromBase64(detailData.content);

            const dateM = detail.match(/<div class="watch-spec-label">Date<\/div>\s*<div class="watch-spec-value">([^<]+)<\/div>/);
            const condM = detail.match(/<div class="watch-spec-label">Condition<\/div>\s*<div class="watch-spec-value">([^<]+)<\/div>/);
            const setM  = detail.match(/<div class="watch-spec-label">Set<\/div>\s*<div class="watch-spec-value">([^<]+)<\/div>/);

            if (dateM) document.getElementById('date').value = dateM[1].trim();
            if (condM) {
                const condSel = document.getElementById('condition');
                condSel.value = condM[1].trim();
            }
            if (setM) {
                const setSel = document.getElementById('watch-set');
                // Try to match existing options, otherwise leave default
                for (let opt of setSel.options) {
                    if (opt.value === setM[1].trim()) { setSel.value = setM[1].trim(); break; }
                }
            }
        } catch(e) {}

    } catch(err) {
        alert('Erreur lors du chargement : ' + err.message);
        cancelEdit();
    }
}

// ─── Update Watch ─────────────────────────────────────────────────────────────
async function updateWatch() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;

    try {
        let brand = document.getElementById('brand').value;
        if (brand === 'Autre') brand = document.getElementById('custom-brand').value.trim();
        const name     = document.getElementById('model-name').value.trim();
        const ref      = document.getElementById('reference').value.trim();
        const date     = document.getElementById('date').value.trim();
        const cond     = document.getElementById('condition').value;
        const set      = document.getElementById('watch-set').value;
        const priceRaw = document.getElementById('price').value.trim();
        const imgFile  = document.getElementById('image-file').files[0];

        if (!name || !priceRaw) {
            alert('Remplis au minimum : nom et prix.');
            btn.disabled = false;
            return;
        }

        const price = formatPrice(priceRaw);
        const id    = editId;
        const n     = parseInt(id.replace('montre', ''));

        initStatus();

        // 1. Handle image: upload new if provided, keep existing otherwise
        let imgName = editCurrentImg;
        if (imgFile) {
            const s1 = addStep(`Upload nouvelle image…`, 'active');
            const imgExt = imgFile.name.includes('.') ? imgFile.name.split('.').pop().toLowerCase() : 'jpeg';
            imgName = `montre${n}.${imgExt}`;
            let imgSha = null;
            try { const ex = await ghGet(imgName); imgSha = ex.sha; } catch(e) {}
            const imgB64 = await fileToBase64(imgFile);
            await ghPutBinary(imgName, imgB64, `Update image ${imgName}`, imgSha);
            setStepDone(s1);
        }

        const cardHtml = generateCard(n, brand, name, ref, price, imgName);
        const fullName = name.startsWith(brand) ? name : `${brand} ${name}`;

        // Rewrite this watch's banner entry so a renamed or re-uploaded image
        // does not leave the banner pointing at the old file.
        const syncBanner = html => updateBannerHtml(html, getBannerItems(html).map(item =>
            item.href === `${id}.html`
                ? { href: item.href, src: imgName, alt: fullName, name: fullName }
                : item
        ));

        // 2. Update index.html
        const s2 = addStep('Mise à jour de index.html…', 'active');
        const indexData = await ghGet('index.html');
        let indexContent = fromBase64(indexData.content);
        indexContent = replaceCard(indexContent, id, cardHtml);
        indexContent = syncBanner(indexContent);
        await ghPut('index.html', indexContent, `Update ${id} (${brand} ${name})`, indexData.sha);
        setStepDone(s2);

        // 3. Update catalogue.html
        const s3 = addStep('Mise à jour de catalogue.html…', 'active');
        const catData = await ghGet('catalogue.html');
        let catContent = fromBase64(catData.content);
        catContent = replaceCard(catContent, id, cardHtml);
        catContent = syncBanner(catContent);
        await ghPut('catalogue.html', catContent, `Update ${id} in catalogue`, catData.sha);
        setStepDone(s3);

        // 4. Update detail page
        const s4 = addStep(`Mise à jour de ${id}.html…`, 'active');
        let detailSha = null;
        try { const ex = await ghGet(`${id}.html`); detailSha = ex.sha; } catch(e) {}
        const detailHtml = generateDetailPage(n, brand, name, ref, date, cond, set, price, imgName);
        await ghPut(`${id}.html`, detailHtml, `Update ${id}.html`, detailSha);
        setStepDone(s4);

        setSuccess(`
            ✓ <strong>${id}</strong> mis à jour avec succès !<br><br>
            <strong>${brand} ${name}</strong> — Réf. ${ref} — €&nbsp;${price}<br><br>
            <a href="https://machiavelliwatches.com/${id}.html" target="_blank" style="color: rgba(180,255,180,0.9)">
                → Voir la page ${id}.html
            </a>
        `);

        cancelEdit();
        loadCatalogue();

    } catch(err) {
        setError(err.message);
    }

    btn.disabled = false;
}

// ─── Replace card in HTML ─────────────────────────────────────────────────────
function replaceCard(htmlContent, id, newCardHtml) {
    const regex = new RegExp(`<a [^>]*id="${id}"[^>]*>[\\s\\S]*?<\\/a>`);
    if (!regex.test(htmlContent)) throw new Error(`Carte "${id}" introuvable dans le fichier.`);
    return htmlContent.replace(regex, newCardHtml);
}

// ─── Load & render catalogue ──────────────────────────────────────────────────
async function loadCatalogue() {
    const grid = document.getElementById('catalogue-grid');
    const loading = document.getElementById('catalogue-loading');
    grid.innerHTML = '';
    loading.style.display = 'block';
    loading.textContent = 'Chargement du catalogue…';

    try {
        const indexData = await ghGet('index.html');
        const content = fromBase64(indexData.content);

        // Parse all watch cards
        const cardRegex = /<a [^>]*class="watch-card"[^>]*id="([^"]+)"[^>]*>\s*<img src="([^"]+)"[^>]*>\s*<div class="watch-info">\s*<h3 class="watch-name">([^<]+)<\/h3>\s*<p class="watch-reference"[^>]*>([^<]*)<\/p>\s*<p class="watch-price">([^<]+)<\/p>/g;

        const watches = [];
        let m;
        while ((m = cardRegex.exec(content)) !== null) {
            watches.push({ id: m[1], img: m[2], name: m[3], ref: m[4], price: m[5] });
        }

        loading.style.display = 'none';

        if (!watches.length) {
            loading.textContent = 'Aucune montre trouvée.';
            loading.style.display = 'block';
            return;
        }

        watches.forEach(w => {
            const card = document.createElement('div');
            card.className = 'admin-card';
            card.id = 'admin-card-' + w.id;
            const imgUrl = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encodeURIComponent(w.img)}?t=${Date.now()}`;
            card.innerHTML = `
                <img src="${imgUrl}" alt="${w.name}" onerror="this.style.background='rgba(255, 255, 255,0.05)';this.style.height='160px'">
                <div class="admin-card-info">
                    <div class="admin-card-name">${w.name}</div>
                    <div class="admin-card-ref">${w.ref || '—'}</div>
                    <div class="admin-card-price">${w.price}</div>
                    <button class="btn-edit" onclick="editWatch('${w.id}', '${w.img}')">✏ Modifier</button>
                    <button class="btn-delete" onclick="deleteWatch('${w.id}', this)">Supprimer</button>
                </div>
            `;
            grid.appendChild(card);
        });

    } catch(err) {
        loading.textContent = 'Erreur : ' + err.message;
        loading.style.display = 'block';
    }
}

// ─── Delete Watch ─────────────────────────────────────────────────────────────
async function deleteWatch(id, btn) {
    if (!confirm(`Supprimer "${id}" ?`)) return;
    btn.disabled = true;
    btn.textContent = '…';

    try {
        // Read & update index.html
        const indexData = await ghGet('index.html');
        let indexContent = fromBase64(indexData.content);
        const cardRegex = new RegExp(`\\s*<a [^>]*id="${id}"[^>]*>[\\s\\S]*?<\\/a>`, 'g');
        const match = cardRegex.exec(indexContent);
        if (!match) throw new Error(`Carte "${id}" introuvable.`);
        const imgMatch = match[0].match(/src="([^"]+)"/);
        const imgSrc = imgMatch ? imgMatch[1] : null;
        let newIndex = indexContent.replace(new RegExp(`\\s*<a [^>]*id="${id}"[^>]*>[\\s\\S]*?<\\/a>`, 'g'), '');
        // Remove from banner if present
        let bannerItems = getBannerItems(newIndex);
        bannerItems = bannerItems.filter(item => item.href !== `${id}.html`);
        newIndex = updateBannerHtml(newIndex, bannerItems);
        await ghPut('index.html', newIndex, `Remove ${id}`, indexData.sha);

        // Update catalogue.html (card + banner, kept in sync with index.html)
        const catData = await ghGet('catalogue.html');
        let newCat = fromBase64(catData.content).replace(new RegExp(`\\s*<a [^>]*id="${id}"[^>]*>[\\s\\S]*?<\\/a>`, 'g'), '');
        newCat = updateBannerHtml(newCat, bannerItems);
        await ghPut('catalogue.html', newCat, `Remove ${id} from catalogue`, catData.sha);

        // Delete detail page
        try { const p = await ghGet(`${id}.html`); await ghDelete(`${id}.html`, `Delete ${id}.html`, p.sha); } catch(e) {}

        // Delete image
        if (imgSrc) {
            try { const img = await ghGet(imgSrc); await ghDelete(imgSrc, `Delete ${imgSrc}`, img.sha); } catch(e) {}
        }

        // Remove card from UI
        const cardEl = document.getElementById('admin-card-' + id);
        if (cardEl) cardEl.remove();

    } catch(err) {
        alert('Erreur : ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Supprimer';
    }
}
