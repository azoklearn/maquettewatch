<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0a0a;
            color: #f4dfba;
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #f4dfba;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 12px;
            color: rgba(244, 223, 186, 0.4);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* Token section */
        #token-section {
            background: rgba(244, 223, 186, 0.04);
            border: 1px solid rgba(244, 223, 186, 0.12);
            border-radius: 4px;
            padding: 24px;
            margin-bottom: 32px;
        }

        #token-section.connected {
            border-color: rgba(100, 200, 100, 0.3);
            background: rgba(100, 200, 100, 0.04);
        }

        .token-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .token-status {
            font-size: 12px;
            letter-spacing: 0.08em;
            color: rgba(244, 223, 186, 0.5);
            margin-bottom: 12px;
        }

        .token-status.ok { color: rgba(100, 220, 100, 0.8); }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full { grid-column: 1 / -1; }

        label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(244, 223, 186, 0.6);
        }

        input, select, textarea {
            background: rgba(244, 223, 186, 0.06);
            border: 1px solid rgba(244, 223, 186, 0.15);
            border-radius: 3px;
            color: #f4dfba;
            font-family: 'Raleway', sans-serif;
            font-size: 14px;
            font-weight: 300;
            padding: 12px 14px;
            width: 100%;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: rgba(244, 223, 186, 0.4);
        }

        select option {
            background: #1a1a1a;
            color: #f4dfba;
        }

        input[type="file"] {
            padding: 10px 14px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: rgba(244, 223, 186, 0.1);
            border: 1px solid rgba(244, 223, 186, 0.2);
            border-radius: 2px;
            color: #f4dfba;
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-right: 12px;
            padding: 6px 14px;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(244, 223, 186, 0.18);
        }

        .image-preview {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 3px;
            margin-top: 8px;
            display: none;
            border: 1px solid rgba(244, 223, 186, 0.1);
        }

        /* Buttons */
        .btn {
            background: transparent;
            border: 1px solid rgba(244, 223, 186, 0.3);
            border-radius: 2px;
            color: #f4dfba;
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            padding: 12px 24px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn:hover { background: rgba(244, 223, 186, 0.08); border-color: rgba(244, 223, 186, 0.5); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary {
            background: rgba(244, 223, 186, 0.1);
            border-color: rgba(244, 223, 186, 0.5);
            width: 100%;
            padding: 16px;
            font-size: 12px;
            margin-top: 8px;
        }

        .btn-primary:hover:not(:disabled) {
            background: rgba(244, 223, 186, 0.18);
        }

        .btn-danger {
            border-color: rgba(220, 80, 80, 0.4);
            color: rgba(220, 150, 150, 0.9);
        }

        /* Divider */

            border: none;
            border-top: 1px solid rgba(244, 223, 186, 0.08);

        /* Status */

            margin-top: 24px;
            padding: 20px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.6;
        }

        #status.loading {

            background: rgba(244, 223, 186, 0.05);
            border: 1px solid rgba(244, 223, 186, 0.15);
            color: rgba(244, 223, 186, 0.7);

            background: rgba(100, 200, 100, 0.06);
            border: 1px solid rgba(100, 200, 100, 0.25);
            color: rgba(180, 255, 180, 0.9);

            color: rgba(255, 160, 160, 0.9);

</head>

<script>
const REPO = 'azoklearn/maquettewatch';
const BRANCH = 'main';

// ─── Token ────────────────────────────────────────────────────────────────────
function saveToken() {
    const t = document.getElementById('token-input').value.trim();
    if (!t) return;
    localStorage.setItem('gh_token', t);
    document.getElementById('token-input').value = '';
    updateTokenUI();
}
function clearToken() {
    localStorage.removeItem('gh_token');
    updateTokenUI();
}
function updateTokenUI() {
    const t = localStorage.getItem('gh_token');
    const section = document.getElementById('token-section');
    const status = document.getElementById('token-status');
    if (t) {
        status.textContent = '✓ Token configuré (' + t.slice(0,8) + '…)';
        status.className = 'token-status ok';
        section.className = 'connected';
    } else {
        status.textContent = 'Token GitHub non configuré';
        status.className = 'token-status';
        section.className = '';
    }
}
updateTokenUI();

// ─── Brand toggle ─────────────────────────────────────────────────────────────
function updateBrandName() {
    const val = document.getElementById('brand').value;
    document.getElementById('custom-brand-group').style.display = val === 'Autre' ? 'flex' : 'none';
}

// ─── Image preview ────────────────────────────────────────────────────────────
function previewImage(input) {
    const preview = document.getElementById('image-preview');
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
        reader.readAsDataURL(input.files[0]);
    }
}

// ─── GitHub helpers ───────────────────────────────────────────────────────────
function getToken() {
    const t = localStorage.getItem('gh_token');
    if (!t) throw new Error('Token GitHub manquant. Configure-le en haut de la page.');
    return t;
}

async function ghGet(path) {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(path)}?ref=${BRANCH}&t=${Date.now()}`, {
        headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error(`GitHub GET ${path}: ${res.status} ${res.statusText}`);
    return res.json();
}

async function ghPut(path, content, message, sha = null) {
    const body = { message, content: toBase64(content), branch: BRANCH };
    if (sha) body.sha = sha;
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(path)}`, {
        method: 'PUT',
        headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    if (!res.ok) { const e = await res.json(); throw new Error(`GitHub PUT ${path}: ${e.message}`); }
    return res.json();
}

async function ghPutBinary(path, base64Content, message, sha = null) {
    const body = { message, content: base64Content, branch: BRANCH };
    if (sha) body.sha = sha;
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(path)}`, {
        method: 'PUT',
        headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    if (!res.ok) { const e = await res.json(); throw new Error(`GitHub PUT binary ${path}: ${e.message}`); }
    return res.json();
}

async function ghDelete(path, message, sha) {
    const body = { message, sha, branch: BRANCH };
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(path)}`, {
        method: 'DELETE',
        headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    if (!res.ok) { const e = await res.json(); throw new Error(`GitHub DELETE ${path}: ${e.message}`); }
    return res.json();
}

function toBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
}
function fromBase64(str) {
    return decodeURIComponent(escape(atob(str.replace(/\s/g, ''))));
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
            const b64 = e.target.result.split(',')[1];
            resolve(b64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// ─── Status UI ────────────────────────────────────────────────────────────────

function addStep(text, state = '') {

    el.className = 'step ' + state;
    el.textContent = text;
    statusEl.appendChild(el);

}
function setStepDone(el) { el.className = 'step done'; }
function setError(msg) {
    statusEl.className = 'error';

}
function setSuccess(msg) {
    statusEl.className = 'success';
    statusEl.innerHTML = msg;
}

    // Accept "11500", "11.500", "11 500" → return "11.500"
    const n = parseFloat(raw.replace(/[\s.]/g, '').replace(',', '.'));
    if (isNaN(n)) return raw;
    return n.toLocaleString('fr-FR').replace(/\s/g, '.').replace(',', '.');
}

// ─── Insert card into HTML ────────────────────────────────────────────────────
function insertCard(htmlContent, cardHtml) {
    // Find the last watch-card and insert after its closing </a>
    const lastCardMatch = [...htmlContent.matchAll(/<a [^>]*class="watch-card"[^>]*>[\s\S]*?<\/a>/g)];
    if (!lastCardMatch.length) throw new Error('Impossible de trouver les cartes dans le fichier HTML.');
    const last = lastCardMatch[lastCardMatch.length - 1];
    const insertPos = last.index + last[0].length;
    return htmlContent.slice(0, insertPos) + '\n' + cardHtml + htmlContent.slice(insertPos);
}

// ─── Find next montre number ──────────────────────────────────────────────────
function findNextN(htmlContent) {
    const matches = [...htmlContent.matchAll(/id="montre(\d+)"/g)];
    if (!matches.length) return 1;
    const nums = matches.map(m => parseInt(m[1]));
    return Math.max(...nums) + 1;
}

// ─── Add Watch ────────────────────────────────────────────────────────────────

        if (brand === 'Autre') brand = document.getElementById('custom-brand').value.trim();
        const name     = document.getElementById('model-name').value.trim();
        const ref      = document.getElementById('reference').value.trim();
        const date     = document.getElementById('date').value.trim();
        const cond     = document.getElementById('condition').value;
        const set      = document.getElementById('watch-set').value;
        const priceRaw = document.getElementById('price').value.trim();
        const imgFile  = document.getElementById('image-file').files[0];

        if (!name || !priceRaw || !imgFile) {
            alert('Remplis au minimum : nom, prix et image.');
            btn.disabled = false;
            return;
        }

        const price    = formatPrice(priceRaw);
        const imgName  = imgFile.name;

        initStatus();

        // 1. Upload image
        const s1 = addStep('Upload de l\'image…', 'active');
        let imgSha = null;
        try { const existing = await ghGet(imgName); imgSha = existing.sha; } catch(e) {}
        const imgB64 = await fileToBase64(imgFile);
        await ghPutBinary(imgName, imgB64, `Add image ${imgName}`, imgSha);
        setStepDone(s1);

        // 2. Read index.html
        const s2 = addStep('Lecture de index.html…', 'active');
        const indexData = await ghGet('index.html');
        const indexContent = fromBase64(indexData.content);
        const nextN = findNextN(indexContent);
        setStepDone(s2);

        // 3. Generate card
        const cardHtml = generateCard(nextN, brand, name, ref, price, imgName);

        // 4. Update index.html
        const s3 = addStep(`Ajout de la carte (montre${nextN}) dans index.html…`, 'active');
        const newIndex = insertCard(indexContent, cardHtml);
        await ghPut('index.html', newIndex, `Add montre${nextN} (${brand} ${name} €${price})`, indexData.sha);
        setStepDone(s3);

        // 5. Update catalogue.html
        const s4 = addStep('Mise à jour de catalogue.html…', 'active');
        const catData = await ghGet('catalogue.html');
        const catContent = fromBase64(catData.content);
        const newCat = insertCard(catContent, cardHtml);
        await ghPut('catalogue.html', newCat, `Add montre${nextN} to catalogue`, catData.sha);
        setStepDone(s4);

        // 6. Create detail page
        const s5 = addStep(`Création de montre${nextN}.html…`, 'active');
        const detailHtml = generateDetailPage(nextN, brand, name, ref, date, cond, set, price, imgName);
        await ghPut(`montre${nextN}.html`, detailHtml, `Create montre${nextN}.html`);
        setStepDone(s5);

        setSuccess(`
            ✓ <strong>montre${nextN}</strong> ajoutée avec succès !<br><br>
            <strong>${brand} ${name}</strong> — Réf. ${ref} — €&nbsp;${price}<br><br>
            <a href="https://machiavelliwatches.com/montre${nextN}.html" target="_blank" style="color: rgba(180,255,180,0.9)">
                → Voir la page montre${nextN}.html
            </a>
        `);

        // Reset form
        document.getElementById('model-name').value = '';
        document.getElementById('reference').value = '';
        document.getElementById('date').value = '';
        document.getElementById('price').value = '';
        document.getElementById('image-file').value = '';
        document.getElementById('image-preview').style.display = 'none';

    } catch(err) {
        setError(err.message);
    }

    btn.disabled = false;
}

// ─── Delete Watch ─────────────────────────────────────────────────────────────
async function deleteWatch() {
    const raw = document.getElementById('delete-id').value.trim();
    if (!raw) return;

    const statusEl2 = document.getElementById('delete-status');
    statusEl2.style.cssText = 'margin-top:16px;padding:16px;border-radius:4px;font-size:13px;background:rgba(244,223,186,0.05);border:1px solid rgba(244,223,186,0.15);color:rgba(244,223,186,0.7);display:block';
    statusEl2.textContent = '…';

    const id = isNaN(raw) ? raw : `montre${raw}`;

    try {
        // Read index.html
        const indexData = await ghGet('index.html');
        let indexContent = fromBase64(indexData.content);

        // Find card block
        const cardRegex = new RegExp(`\\s*<a [^>]*id="${id}"[^>]*>[\\s\\S]*?<\\/a>`, 'g');
        const match = cardRegex.exec(indexContent);
        if (!match) throw new Error(`Carte "${id}" introuvable dans index.html.`);

        // Get image src from card
        const imgMatch = match[0].match(/src="([^"]+)"/);
        const imgSrc = imgMatch ? imgMatch[1] : null;

        // Remove card from index
        const newIndex = indexContent.replace(cardRegex, '');
        await ghPut('index.html', newIndex, `Remove ${id}`, indexData.sha);

        // Remove card from catalogue
        const catData = await ghGet('catalogue.html');
        let catContent = fromBase64(catData.content);
        const newCat = catContent.replace(new RegExp(`\\s*<a [^>]*id="${id}"[^>]*>[\\s\\S]*?<\\/a>`, 'g'), '');
        await ghPut('catalogue.html', newCat, `Remove ${id} from catalogue`, catData.sha);

        // Delete detail page
        try {
            const pageData = await ghGet(`${id}.html`);
            await ghDelete(`${id}.html`, `Delete ${id}.html`, pageData.sha);
        } catch(e) { /* page may not exist */ }

        // Delete image
        if (imgSrc) {
            try {
                const imgData = await ghGet(imgSrc);
                await ghDelete(imgSrc, `Delete image ${imgSrc}`, imgData.sha);
            } catch(e) { /* image may not exist */ }
        }

        statusEl2.style.background = 'rgba(100,200,100,0.06)';
        statusEl2.style.borderColor = 'rgba(100,200,100,0.25)';
        statusEl2.style.color = 'rgba(180,255,180,0.9)';
        statusEl2.textContent = `✓ ${id} supprimée avec succès.`;
        document.getElementById('delete-id').value = '';

    } catch(err) {
        statusEl2.style.background = 'rgba(220,80,80,0.06)';
        statusEl2.style.borderColor = 'rgba(220,80,80,0.25)';
        statusEl2.style.color = 'rgba(255,160,160,0.9)';
        statusEl2.textContent = 'Erreur : ' + err.message;
    }
}
