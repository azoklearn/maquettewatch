    <!-- Contact Section -->
    <section class="catalogue-page" style="padding-top: 150px;">
        <div class="container">
            <div class="section-header" style="margin-bottom: 60px;">
                <div class="section-label">Contact Us</div>
                <h2 class="section-title" style="color: #f4dfba;">Contact</h2>
            </div>

            <div class="contact-content-wrapper" style="display: grid; grid-template-columns: 1fr 1fr; gap: 60px; max-width: 1000px; margin: 0 auto;">
                <!-- Formulaire de contact -->
                <div>
                    <h3 style="color: #f4dfba; font-family: var(--font-serif); font-size: 24px; margin-bottom: 30px; font-weight: 600;">Send us a message</h3>
                    <form id="contactForm" style="display: flex; flex-direction: column; gap: 20px;">
                        <div>
                            <label for="name" style="display: block; color: #f4dfba; font-family: var(--font-sans); font-size: 14px; margin-bottom: 8px; font-weight: 500;">Name *</label>
                            <input type="text" id="name" name="name" required style="width: 100%; padding: 14px 20px; border: 1px solid rgba(244, 223, 186, 0.3); background: rgba(255, 255, 255, 0.1); color: #f4dfba; font-family: var(--font-sans); font-size: 14px; border-radius: 0; transition: all 0.3s ease; box-sizing: border-box;">
                        </div>
                        <div>
                            <label for="email" style="display: block; color: #f4dfba; font-family: var(--font-sans); font-size: 14px; margin-bottom: 8px; font-weight: 500;">Email *</label>
                            <input type="email" id="email" name="email" required style="width: 100%; padding: 14px 20px; border: 1px solid rgba(244, 223, 186, 0.3); background: rgba(255, 255, 255, 0.1); color: #f4dfba; font-family: var(--font-sans); font-size: 14px; border-radius: 0; transition: all 0.3s ease; box-sizing: border-box;">
                        </div>
                        <div>
                            <label for="message" style="display: block; color: #f4dfba; font-family: var(--font-sans); font-size: 14px; margin-bottom: 8px; font-weight: 500;">Message *</label>
                            <textarea id="message" name="message" rows="6" required style="width: 100%; padding: 14px 20px; border: 1px solid rgba(244, 223, 186, 0.3); background: rgba(255, 255, 255, 0.1); color: #f4dfba; font-family: var(--font-sans); font-size: 14px; border-radius: 0; transition: all 0.3s ease; resize: vertical; box-sizing: border-box;"></textarea>
                        </div>
                        <button type="submit" style="padding: 16px 40px; background: transparent; color: #f4dfba; border: 2px solid #f4dfba; font-family: var(--font-sans); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; cursor: pointer; transition: all 0.3s ease; align-self: flex-start;">
                            Send
                        </button>
                    </form>
                </div>

                <!-- Réseaux sociaux -->
                <div>
                    <h3 style="color: #f4dfba; font-family: var(--font-serif); font-size: 24px; margin-bottom: 30px; font-weight: 600;">Follow us</h3>
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <a href="https://www.instagram.com/machiavelli_group/" target="_blank" rel="noopener noreferrer" class="social-contact-link">
                            <span style="font-size: 24px;">📷</span>
                            <span style="font-family: var(--font-sans); font-size: 16px; font-weight: 500;">Instagram</span>
                        </a>
                        <a href="https://api.whatsapp.com/send?phone=32484709109" target="_blank" rel="noopener noreferrer" class="social-contact-link">
                            <span style="font-size: 24px;">💬</span>
                            <span style="font-family: var(--font-sans); font-size: 16px; font-weight: 500;">WhatsApp</span>
                        </a>
                        <a href="https://www.facebook.com/p/Machiavelli-Watches-61559890238299/" target="_blank" rel="noopener noreferrer" class="social-contact-link">
                            <span style="font-size: 24px;">👥</span>
                            <span style="font-family: var(--font-sans); font-size: 16px; font-weight: 500;">Facebook</span>
                        </a>
                        <a href="https://www.tiktok.com/@machiavelli_group" target="_blank" rel="noopener noreferrer" class="social-contact-link">
                            <span style="font-size: 24px;">🎵</span>
                            <span style="font-family: var(--font-sans); font-size: 16px; font-weight: 500;">TikTok</span>
                        </a>
                    </div>
                </div>
            </div>

    <script src="script.js"></script>
    <script>
        // Gestion du formulaire de contact
        document.addEventListener('DOMContentLoaded', function() {
            const contactForm = document.getElementById('contactForm');
            
            if (contactForm) {
                contactForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const name = document.getElementById('name').value;
                    const email = document.getElementById('email').value;
                    const message = document.getElementById('message').value;
                    
                    // Créer le lien mailto avec les informations du formulaire
                    const subject = encodeURIComponent('Contact depuis le site Machiavelli');
                    const body = encodeURIComponent(`Nom: ${name}\nEmail: ${email}\n\nMessage:\n${message}`);
                    const mailtoLink = `mailto:Machiavelliwatches@icloud.com?subject=${subject}&body=${body}`;
                    
                    // Ouvrir le client de messagerie
                    window.location.href = mailtoLink;
                    
                    // Optionnel: Afficher un message de confirmation
                    alert('Votre client de messagerie va s\'ouvrir. Merci de votre message !');
                });
            }
        });
    </script>
